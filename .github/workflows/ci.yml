name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/test-closure-insights.mjs
      - run: node scripts/test-scoring360-policy.mjs
      - run: node scripts/test-scoring360-api.mjs
      - run: npm run static:validate
      - run: npm audit --audit-level=high
